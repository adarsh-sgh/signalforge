services:
  redpanda:
    image: redpandadata/redpanda:v24.2.7
    command:
      - redpanda start --smp 1 --overprovisioned --memory 512M
      - --kafka-addr internal://0.0.0.0:29092,external://0.0.0.0:9092
      - --advertise-kafka-addr internal://redpanda:29092,external://localhost:9092
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 5s
      retries: 20

  opensearch:
    image: opensearchproject/opensearch:2.17.1
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 5s
      retries: 30

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    environment:
      - CLICKHOUSE_SKIP_USER_SETUP=1
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    ports:
      - "8123:8123"   # http (clickhouse-connect)
      - "9000:9000"   # native
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8123/ping | grep -q Ok"]
      interval: 5s
      retries: 30

  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20

  # S3-compatible object storage for the Delta table. SeaweedFS rather than MinIO because
  # MinIO stopped publishing public images; the s3a and Trino config is the same either way.
  s3:
    image: chrislusf/seaweedfs:3.80
    command: server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json -ip=s3 -master.volumeSizeLimitMB=128
    volumes:
      - ./docker/s3/identities.json:/etc/seaweedfs/s3.json:ro
    ports:
      - "8333:8333"
    healthcheck:
      # the master status endpoint, because the S3 port rejects unsigned requests once
      # identities.json is in place
      test: ["CMD-SHELL", "wget -qO- http://s3:9333/cluster/status >/dev/null || exit 1"]
      interval: 5s
      retries: 30

  s3-init:
    image: chrislusf/seaweedfs:3.80
    depends_on:
      s3: { condition: service_healthy }
    entrypoint: ["sh", "-c", "echo 's3.bucket.create -name lake' | weed shell -master=s3:9333 && echo bucket lake ready"]

  trino:
    image: trinodb/trino:476
    ports:
      - "8080:8080"
    volumes:
      - ./docker/trino/config.properties:/etc/trino/config.properties:ro
      - ./docker/trino/jvm.config:/etc/trino/jvm.config:ro
      - ./docker/trino/node.properties:/etc/trino/node.properties:ro
      - ./docker/trino/catalog/delta.properties:/etc/trino/catalog/delta.properties:ro
    depends_on:
      s3: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/v1/info | grep -q '\"starting\":false'"]
      interval: 5s
      retries: 40

  # Flink: PyFlink has x86_64-only Linux wheels, hence the pinned platform.
  flink-jobmanager:
    build: { context: ., dockerfile: docker/flink.Dockerfile }
    image: signalforge-flink:dev
    platform: linux/amd64
    command: jobmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 4
        parallelism.default: 1
      - SF_KAFKA_BOOTSTRAP=redpanda:29092
    ports:
      - "8081:8081"   # web ui + rest api (job submission, metrics)
    volumes:
      - .:/opt/signalforge
    depends_on:
      redpanda: { condition: service_healthy }

  flink-taskmanager:
    image: signalforge-flink:dev
    platform: linux/amd64
    command: taskmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 4
      - SF_KAFKA_BOOTSTRAP=redpanda:29092
    volumes:
      - .:/opt/signalforge
    depends_on: [flink-jobmanager]
