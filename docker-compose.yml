services:
  redpanda:
    image: redpandadata/redpanda:v24.2.7
    command:
      - redpanda start --smp 1 --overprovisioned --memory 512M
      - --kafka-addr internal://0.0.0.0:29092,external://0.0.0.0:9092
      - --advertise-kafka-addr internal://redpanda:29092,external://localhost:9092
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 5s
      retries: 20

  opensearch:
    image: opensearchproject/opensearch:2.17.1
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 5s
      retries: 30

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    environment:
      - CLICKHOUSE_SKIP_USER_SETUP=1
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    ports:
      - "8123:8123"   # http (clickhouse-connect)
      - "9000:9000"   # native
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8123/ping | grep -q Ok"]
      interval: 5s
      retries: 30

  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20

  # S3-compatible storage for the Delta table; `lake` is the bucket Trino and Spark share.
  minio:
    image: minio/minio:RELEASE.2024-09-22T00-33-43Z
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"   # console
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 5s
      retries: 30

  minio-init:
    image: minio/mc:RELEASE.2024-10-02T08-27-28Z
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: >
      sh -c "mc alias set lake http://minio:9000 minioadmin minioadmin &&
             mc mb --ignore-existing lake/lake &&
             mc ls lake/"

  # Flink: PyFlink has x86_64-only Linux wheels, hence the pinned platform.
  flink-jobmanager:
    build: { context: ., dockerfile: docker/flink.Dockerfile }
    image: signalforge-flink:dev
    platform: linux/amd64
    command: jobmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 4
        parallelism.default: 1
      - SF_KAFKA_BOOTSTRAP=redpanda:29092
    ports:
      - "8081:8081"   # web ui + rest api (job submission, metrics)
    volumes:
      - .:/opt/signalforge
    depends_on:
      redpanda: { condition: service_healthy }

  flink-taskmanager:
    image: signalforge-flink:dev
    platform: linux/amd64
    command: taskmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 4
      - SF_KAFKA_BOOTSTRAP=redpanda:29092
    volumes:
      - .:/opt/signalforge
    depends_on: [flink-jobmanager]
