name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.9" }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      # delta-spark is fetched through spark.jars.packages on first use
      - uses: actions/cache@v4
        with:
          path: ~/.ivy2
          key: ivy-${{ hashFiles('requirements.txt') }}
      - run: pip install -r requirements.txt
      - run: python -m grpc_tools.protoc -Iproto --python_out=signalforge/events proto/signal_event.proto
      - run: python -m pytest -q
        env: { PYTHONPATH: . }

  flink:
    # PyFlink publishes x86_64-only Linux wheels, which is exactly what this runner is; locally the
    # same tests run in the linux/amd64 image (`make flink-test`).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.9" }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - run: pip install -r requirements-flink.txt "grpcio-tools>=1.60,<1.63"
      - run: python -m grpc_tools.protoc -Iproto --python_out=signalforge/events proto/signal_event.proto
      - run: python -m pytest -q tests/flink
        env: { PYTHONPATH: . }
