# Delta Lake over the S3-compatible store with a file metastore: no Hive Metastore container to run, and
# `register_table` is how the table Spark wrote gets a name Trino can query.
connector.name=delta_lake
hive.metastore=file
hive.metastore.catalog.dir=s3://lake/metastore
delta.register-table-procedure.enabled=true
fs.native-s3.enabled=true
s3.endpoint=http://s3:8333
s3.region=us-east-1
s3.path-style-access=true
s3.aws-access-key=signalforge
s3.aws-secret-key=signalforge
